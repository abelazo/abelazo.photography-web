---
name: Deploy

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  verify:
    # Skip semantic-release's own version-bump commit.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One job per browser engine, in parallel. A failure in one engine
      # doesn't cancel the others — collect every engine's result.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      # The `-prod` project's webServer runs `pnpm build` itself, so no separate
      # build step is needed here.
      - run: pnpm test:e2e --project=${{ matrix.project }} --project=${{ matrix.project }}-prod
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3

  release:
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.semrel.outputs.released }}
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - id: semrel
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: netlify
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          pnpm --package=netlify-cli@27.4.1 dlx netlify deploy --prod \
            --dir=dist --no-build --message "release v${VERSION}" --json \
            | tee deploy.json
          url=$(node -p "let d=require('./deploy.json'); d.url || d.deploy_url")
          echo "url=$url" >> "$GITHUB_OUTPUT"
